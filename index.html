<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="'width=device-width, initial-scale=1">
    <title>나만의 반응형 웹페이지</title>
    <meta name="viewport" content="'width=device-width, initial-scale=1">
    <style type="text/css" media="screen, print">
        @font-face {
            font-family: 'Suit';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_suit@1.0/SUIT-ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }
        body{
            font-family: "Suit",serif;
            margin:0;
            padding: 40px 20px;
            text-align: center;
            line-height: 1.8;
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background-image: url('https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyNTA0MTRfMjQx%2FMDAxNzQ0NTU3MTE4NjIx.YNsniHjK6A3EHjguX5dblsXKoamy9m7NKvHQEBxHKiwg.eS41IyAI280xyngkaSQzLvXZWynCk3RS9WlKR4ps_-Ag.JPEG%2F00465522b2a626dd3c7c6045de941f07.jpg&type=sc960_832');
            background-position: center;
            background-size: cover;
            padding: 40px 30px; 
            border-radius: 20px; 
            
        }

        .title{
            font-size: 3vw;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .author{
            font-size: 2vw;
            color: gray;
            margin-bottom: 20px;
            text-align: right;
            padding-right: 100px;
        }

        .content{
            font-size: 1.5vw;
        }
        
        @media (max-width: 768px) {
            .title{
                font-size:32px;
            }

            .author { 
                font-size: 22px; 
            }

            .content {
                font-size: 18px;
            }

        }


    </style>
</head>
<body>
    <div class="container">
        <div class="title">행복</div>
        <div class="author">-나태주-</div>
        <div class="content">
            <p>
                저녁때<br>
                돌아갈 집이 있다는 것<br>
                <br>
                힘들 때<br>
                마음속으로 생각할 사람 있다는 것<br>
                <br>
                외로울 때<br>
                혼자서 부를 노래 있다는 것
            </p>
        </div>
    </div>
</body>
</html>
